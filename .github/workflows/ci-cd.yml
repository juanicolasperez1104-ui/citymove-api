# CityMove API - CI/CD pipeline with 4 stages: test -> build -> push -> deploy
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, RENDER_DEPLOY_HOOK_URL
# Required repository variable: RENDER_APP_URL  (e.g. https://citymove-api.onrender.com)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: citymove-api
  APP_DIR: citymove-api

jobs:
  # ---------------------------------------------------------------- 1. TEST
  test:
    name: 1 - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citymove-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: citymove-api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage gate
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: citymove-api/coverage.xml

  # ---------------------------------------------------------------- 2. BUILD
  build:
    name: 2 - Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-stage image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container (non-root + /health)
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e JWT_SECRET="$(openssl rand -hex 32)" -e DATABASE_URL="sqlite:////app/data/ci.db" \
            "${IMAGE_NAME}:${GITHUB_SHA}"
          test "$(docker exec smoke id -u)" != "0"
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 2; done
          curl -fsS http://localhost:8000/health | grep '"ok"'
          docker image ls "${IMAGE_NAME}"
          docker rm -f smoke
      - name: Save image for the push stage
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------- 3. PUSH
  push:
    name: 3 - Push to Docker Hub
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push (commit SHA + latest)
        id: tags
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker load < image.tar.gz
          REPO="docker.io/${DH_USER}/${IMAGE_NAME}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REPO}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REPO}:latest"
          docker push "${REPO}:${GITHUB_SHA}"
          docker push "${REPO}:latest"
          echo "image=${REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- 4. DEPLOY
  deploy:
    name: 4 - Deploy to Render
    needs: push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_APP_URL }}
    steps:
      - name: Trigger Render deploy hook with the new image
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.push.outputs.image }}
        run: |
          test -n "$HOOK" || { echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing"; exit 1; }
          ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$IMAGE")
          curl -fsS -X POST "${HOOK}&imgURL=${ENCODED}"
      - name: Wait until the public URL is healthy
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          test -n "$APP_URL" || { echo "::error::RENDER_APP_URL variable is missing"; exit 1; }
          sleep 45
          for i in $(seq 1 30); do
            if curl -fsS "${APP_URL}/health"; then echo; echo "Deployed: ${APP_URL}"; exit 0; fi
            sleep 10
          done
          echo "::error::${APP_URL}/health did not answer in time"; exit 1
